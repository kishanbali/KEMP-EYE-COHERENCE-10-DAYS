<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="description" content="KEMP EYE COHERENCE — a 10-day, 10-minute sound experience.">
<title>KEMP EYE COHERENCE 👁</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071019;color:#eafcff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 50% 8%,#193d48,#071019 58%)}button{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 15px 38px}.hero{text-align:center;padding:12px 0 22px}.eye{font-size:58px;line-height:1}.hero h1{font-size:25px;letter-spacing:2px;margin:9px 0 6px}.hero h1 span{color:#e5ca70}.sub{font-size:12px;letter-spacing:1.5px;opacity:.72}.card{background:#0a1820e8;border:1px solid #294650;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 14px 35px #0005}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:13px}.day{border:1px solid #31515c;background:#0d222b;color:#eafcff;border-radius:13px;padding:11px 3px;font-weight:800;cursor:pointer}.day.active{border-color:#67ddf5;box-shadow:0 0 18px #61d9f133}.center{text-align:center}.orb{width:130px;height:130px;margin:15px auto;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle,#fff,#254b55);box-shadow:0 0 0 13px #fff1,0 0 48px #61d9f133;animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.07)}}.play{width:100%;padding:18px;border:0;border-radius:17px;background:#18a9c7;color:white;font-weight:900;font-size:18px;cursor:pointer}.timer{font-size:38px;text-align:center;margin:15px}.bar{height:7px;background:#18343d;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#61d9f1;transition:width .15s linear}.stop{width:100%;padding:12px;border:0;border-radius:14px;margin-top:10px;background:#18323b;color:#fff;font-weight:800;cursor:pointer}.status{min-height:18px;margin-top:12px;font-size:11px;opacity:.58}.footer{text-align:center;margin-top:24px;font-size:10px;opacity:.6;line-height:1.6}.sources{font-size:9px;opacity:.45;margin-top:7px}
</style>
</head>
<body>
<main class="app">
<header class="hero"><div class="eye">👁</div><h1>KEMP EYE <span>COHERENCE</span></h1><div class="sub">10 DAY EXPERIENCE · 10 MINUTES</div></header>
<section class="card"><b id="counter">DAY 1 / 10</b><div class="days" id="days"></div></section>
<section class="card center">
<div class="orb">👁</div>
<button class="play" id="play">▶ PLAY</button>
<audio id="audio" preload="auto" playsinline></audio>
<div class="timer" id="timer">10:00</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<button class="stop" id="stop">■ STOP</button>
<div class="status" id="status"></div>
</section>
<div class="footer">© KishanBali — KEMP Wisdom Publications<div class="sources">CC0 source recordings documented in the project README.</div></div>
</main>
<script>
const audio=document.getElementById('audio'),base='https://bigsoundbank.com/UPLOAD/mp3/';
const sources=[1110,1109,2553,2554,2555,1110,1109,2553,2554,2555];
const names=['day-1','day-2','day-3','day-4','day-5','day-6','day-7','day-8','day-9','day-10'];
let current=1,running=false,start=0,raf=null;
function render(){const days=document.getElementById('days');days.innerHTML='';names.forEach((_,i)=>{const b=document.createElement('button');b.className='day '+(i+1===current?'active':'');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>select(i+1);days.appendChild(b)})}
function select(n){stop();current=n;document.getElementById('counter').textContent=`DAY ${n} / 10`;audio.src=base+sources[n-1]+'.mp3';document.getElementById('status').textContent='';render()}
function tick(){if(!running)return;const e=performance.now()-start;const left=Math.max(0,600000-e)/1000;document.getElementById('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(Math.ceil(left%60)).padStart(2,'0');document.getElementById('fill').style.width=Math.min(100,e/600000*100)+'%';if(e>=600000){stop();document.getElementById('timer').textContent='00:00';document.getElementById('fill').style.width='100%';return}raf=requestAnimationFrame(tick)}
async function play(){if(running){stop();return}running=true;start=performance.now();document.getElementById('play').textContent='■ PLAYING';document.getElementById('status').textContent='';try{audio.currentTime=0;await audio.play()}catch(e){document.getElementById('status').textContent='Audio could not start here. Open a CC0 source listed in the README.';running=false;document.getElementById('play').textContent='▶ PLAY';return}tick()}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;audio.pause();try{audio.currentTime=0}catch(e){}document.getElementById('play').textContent='▶ PLAY';document.getElementById('timer').textContent='10:00';document.getElementById('fill').style.width='0%'}
document.getElementById('play').onclick=play;document.getElementById('stop').onclick=stop;render();select(1);
</script>
</body>
</html>
