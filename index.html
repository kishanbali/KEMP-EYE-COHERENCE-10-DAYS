<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071019"><title>KEMP EYE COHERENCE 👁</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 8%,#193d48,#071019 58%);color:#eafcff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 15px 38px}.hero{text-align:center;padding:12px 0 22px}.eye{font-size:58px}h1{font-size:25px;letter-spacing:2px;margin:7px 0}h1 span{color:#e5ca70}.card{background:#0a1820e8;border:1px solid #294650;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 14px 35px #0005}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:13px}.day{border:1px solid #31515c;background:#0d222b;color:#eafcff;border-radius:13px;padding:11px 3px;font-weight:800}.day.active{border-color:#67ddf5;box-shadow:0 0 18px #67ddf533}.center{text-align:center}.orb{width:130px;height:130px;margin:15px auto;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle,#fff,#254b55);box-shadow:0 0 0 13px #fff1,0 0 48px #61d9f133;animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.07)}}.play{width:100%;padding:18px;border:0;border-radius:17px;background:#18a9c7;color:white;font-weight:900;font-size:18px}.timer{font-size:38px;text-align:center;margin:15px}.bar{height:7px;background:#18343d;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#61d9f1}.stop{width:100%;padding:12px;border:0;border-radius:14px;margin-top:10px;background:#18323b;color:#fff;font-weight:800}.footer{text-align:center;margin-top:24px;font-size:10px;opacity:.6}</style></head><body><main class="app"><header class="hero"><div class="eye">👁</div><h1>KEMP EYE <span>COHERENCE</span></h1><div>10 DAY EXPERIENCE</div></header><section class="card"><b id="counter">DAY 1 / 10</b><div class="days" id="days"></div></section><section class="card center"><div class="orb">👁</div><button class="play" id="play">▶ PLAY</button><audio id="audio" preload="metadata"></audio><div class="timer" id="timer">10:00</div><div class="bar"><div class="fill" id="fill"></div></div><button class="stop" id="stop">■ STOP</button></section><div class="footer">© KishanBali — KEMP Wisdom Publications</div></main><script>const audio=document.getElementById('audio'),base='./audio/';let current=1,running=false,start,raf;const files=Array.from({length:10},(_,i)=>`day-${i+1}.mp3`);function render(){days.innerHTML='';files.forEach((_,i)=>{let b=document.createElement('button');b.className='day '+(i+1===current?'active':'');b.textContent=i+1;b.onclick=()=>select(i+1);days.appendChild(b)})}function select(n){stop();current=n;counter.textContent=`DAY ${n} / 10`;audio.src=base+files[n-1];render()}function tick(){if(!running)return;let e=performance.now()-start,s=Math.max(0,600000-e)/1000;timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.ceil(s%60)).padStart(2,'0');fill.style.width=Math.min(100,e/600000*100)+'%';if(e>=600000){stop();timer.textContent='00:00';fill.style.width='100%';return}raf=requestAnimationFrame(tick)}function play(){if(running){stop();return}running=true;start=performance.now();play.textContent='■ PLAYING';audio.currentTime=0;audio.play().catch(()=>{});tick()}function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;audio.pause();audio.currentTime=0;play.textContent='▶ PLAY';timer.textContent='10:00';fill.style.width='0%'}document.getElementById('play').onclick=play;document.getElementById('stop').onclick=stop;render();select(1);</script></body></html>
